# Static analysis of all three languages and of these workflows. scripts/check.sh is what a
# change must pass (ADR-012); this looks for what a compiler, clippy and the analyzers do not:
# a tainted value reaching a query or a path, a workflow that trusts what it should not.
# Findings land in the repository's Security tab and do not block a merge by themselves.
name: codeql

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, so a query added to CodeQL is run against code that has not changed.
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # uploading the findings
    strategy:
      fail-fast: false
      matrix:
        # None of these needs a build to be analysed.
        language: [rust, csharp, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
