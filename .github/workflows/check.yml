# CI runs scripts/check.sh and nothing else, so what passes locally is exactly what passes
# here (docs/DECISIONS.md ADR-012). CHECK_STRICT=1 turns a missing tool into a failure, so a
# check can never be silently skipped in CI the way it may be on a developer's machine.
name: check

on:
  push:
    branches: [master]
  pull_request:
  # release.yml runs every check here before it builds anything it would publish.
  workflow_call:

permissions:
  contents: read

# Every action is pinned to a commit, not a tag: a tag can be moved to different code after the
# fact, a commit cannot. The trailing comment names the release, and dependabot bumps both.

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Rust toolchain
        run: rustup component add rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'deny.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install cargo-deny
        run: cargo deny --version || cargo install cargo-deny --locked

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # web/package.json's engines field, which .npmrc's engine-strict enforces.
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: scripts/check.sh
        env:
          CHECK_STRICT: '1'
        run: ./scripts/check.sh

  # vigild's static Linux binary is what actually gets deployed to the host, so a change that
  # breaks the musl cross-build must not be mergeable (docs/DECISIONS.md ADR-005).
  # vigil-core's NativeAOT build is checked by the job after this one.
  musl-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Add the musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: musl-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: musl-${{ runner.os }}-

      - name: Build vigild
        run: cargo build --release --target x86_64-unknown-linux-musl -p vigild

      - name: Check that vigild is static
        run: |
          path="target/x86_64-unknown-linux-musl/release/vigild"
          file "$path"
          # A dynamically linked binary would not run on a minimal host, which is the whole
          # point of the musl target.
          file "$path" | grep -q 'static' || { echo "vigild is not statically linked"; exit 1; }

  # vigil-core ships as a NativeAOT binary (docs/DECISIONS.md ADR-016). The trimmer and the AOT
  # compiler warn about reflection only when they run, which an ordinary build never does, and
  # warnings are errors: a change that would break the native build must not be mergeable.
  # ubuntu-latest has clang and zlib's headers already.
  vigil-core-aot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Publish vigil-core with NativeAOT
        run: dotnet publish core/Vigil.Core -c Release -r linux-x64 -p:AssemblyName=vigil-core -o out

      - name: Check that it starts and refuses a bad configuration
        run: |
          # Validation runs before anything is opened, so this needs no database or vigild,
          # and it proves the binary binds the environment: PERSIST_INTERVAL_SECONDS has to
          # reach the validator to be refused.
          if PERSIST_INTERVAL_SECONDS=-1 ./out/vigil-core > log.txt 2>&1; then
            echo "vigil-core accepted PERSIST_INTERVAL_SECONDS=-1"; exit 1
          fi
          grep -q 'PERSIST_INTERVAL_SECONDS must be a positive number' log.txt || { cat log.txt; exit 1; }
