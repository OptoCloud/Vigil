# An example vigild configuration: copy it to /etc/vigil/vigild.toml and change what is
# specific to your machine (the ports, the fan channels and their curves). Validate after
# editing, without touching any fan:
#   /opt/vigil/vigild --config /etc/vigil/vigild.toml --check
#
# The machine this describes: a NAS with an LSI SAS HBA (eight disks on its phys), a four-bay
# stack on the motherboard's SATA ports with three disks in it, two SSDs, a GPU, and a Nuvoton NCT6798D Super I/O
# driving six fan headers. The tests read this file, so it always validates.

poll_interval_secs = 2
# If the control loop doesn't complete a poll within this window, every channel is released
# back to BIOS control. Must be at least twice poll_interval_secs.
deadman_timeout_secs = 30
# How often the hwmon tree is re-scanned, so a drive that resets or is hot-swapped is
# picked back up without a restart.
sensor_rescan_interval_secs = 30

[api]
# Unix socket only, never a network port. Try it from the host with:
#   curl --unix-socket /run/vigil/vigild.sock http://localhost/status
#   curl -N --unix-socket /run/vigil/vigild.sock http://localhost/events
socket_path = "/run/vigil/vigild.sock"
socket_mode = "0660"
# For a consumer in an UNPRIVILEGED LXC: bind-mount the directory (not the socket file,
# which is recreated on every start) into the container,
#   pct set <vmid> -mp0 /run/vigil,mp=/mnt/vigil
# and give the socket to the host uid/gid the container maps to: 100000 is the container's
# root, and 102000 the group it sees as gid 2000, which vigil-core runs as there. Without
# these the socket is root:root 0660 and vigil-core can't open it, while every check run
# from the host as root still works. Leave both out for a consumer that runs as root.
socket_uid = 100000
socket_gid = 102000
max_clients = 16

[gpu]
enabled = true
min_read_interval_secs = 6
timeout_secs = 5

# The HBA's own temperature, read over /dev/mpt3ctl (mpt3sas controllers only).
[hba]
enabled = true
device_path = "/dev/mpt3ctl"
ioc_number = 0

[drive_health]
enabled = true
poll_interval_secs = 900
timeout_secs = 60

# Pool state from `zpool status`. It reads kernel state and wakes no disk, so it can poll far
# more often than SMART: this interval is how long a faulted disk can go unseen by vigil.
[zfs]
enabled = true
zpool_path = "/usr/sbin/zpool"
poll_interval_secs = 60
timeout_secs = 15

# The host's load from /proc (ADR-025): memory and ARC, CPU, load, pressure, and every whole
# disk's traffic. Interfaces are published only when listed, because everything vigild
# publishes reaches the dashboard, and on a hypervisor the names of a guest's tap and veth
# devices give the guests away. vmbr0 is Proxmox's default bridge.
[host]
enabled = true
poll_interval_secs = 2
interfaces = ["vmbr0"]

# Zones group sensors by the airflow they sit in, not by sensor category: here, one zone per
# drive cage and one for the components the top intake blows across.
#
# Zones name bays by port: "port:" plus the drive's /dev/disk/by-path name, which carries
# the controller's PCI address and the port or phy on it. A port stays with the bay, so a
# swapped disk lands in the right zone with no config change; a drive's WWN (its sensor
# id, "drive:naa...") follows the disk and is what history and SMART are keyed on.
# `ls -l /dev/disk/by-path/` lists them. Here 0000:03:00.0 is the HBA and 0000:01:00.1 the
# motherboard's SATA controller, whose ata numbers are the board's port numbers, not probe
# order. A port named in a zone with no drive on it counts as an unreadable sensor, so name
# only the ports in use.

# The HBA's eight phys, every one a disk.
[[zones]]
id = "eight-bay"
sensor_ids = ["port:pci-0000:03:00.0-sas-*"]

[[zones]]
id = "four-bay"
# Three disks in the left stack; its fourth slot (ata-6) is empty, so it is not named here.
sensor_ids = ["port:pci-0000:01:00.1-ata-3", "port:pci-0000:01:00.1-ata-4", "port:pci-0000:01:00.1-ata-5"]

# The HBA itself and two SSDs on SATA ports 1 and 2, which sit in the top intake's air.
[[zones]]
id = "component-bay"
sensor_ids = ["hba", "port:pci-0000:01:00.1-ata-1", "port:pci-0000:01:00.1-ata-2"]

# Bays: where each port is in the case, so the page can say which disk to pull. Number the
# slots as the cages are labelled. A bay is the port alone, without the "port:" a zone member
# carries. An empty bay may be listed: it then shows as an empty slot, not as no slot at all.
[[bays]]
port = "pci-0000:03:00.0-sas-phy0-lun-0"
cage = "8-bay"
slot = 1

[[bays]]
port = "pci-0000:03:00.0-sas-phy1-lun-0"
cage = "8-bay"
slot = 2

[[bays]]
port = "pci-0000:03:00.0-sas-phy2-lun-0"
cage = "8-bay"
slot = 3

[[bays]]
port = "pci-0000:03:00.0-sas-phy3-lun-0"
cage = "8-bay"
slot = 4

[[bays]]
port = "pci-0000:03:00.0-sas-phy4-lun-0"
cage = "8-bay"
slot = 5

[[bays]]
port = "pci-0000:03:00.0-sas-phy5-lun-0"
cage = "8-bay"
slot = 6

[[bays]]
port = "pci-0000:03:00.0-sas-phy6-lun-0"
cage = "8-bay"
slot = 7

[[bays]]
port = "pci-0000:03:00.0-sas-phy7-lun-0"
cage = "8-bay"
slot = 8

[[bays]]
port = "pci-0000:01:00.1-ata-3"
cage = "4-bay"
slot = 1

[[bays]]
port = "pci-0000:01:00.1-ata-4"
cage = "4-bay"
slot = 2

[[bays]]
port = "pci-0000:01:00.1-ata-5"
cage = "4-bay"
slot = 3

[[bays]]
port = "pci-0000:01:00.1-ata-6"
cage = "4-bay"
slot = 4

# Which header drives which fan: find out with deploy/walk-fan-headers.sh, which drives each
# channel in turn and watches which tach responds. Here pwm6 is unwired.

[[channels]]
id = "drive-cage"
chip_name = "nct6798"
index = 1
minimum_duty_percent = 30

[[channels]]
id = "cpu-cooler-front"
chip_name = "nct6798"
index = 2
minimum_duty_percent = 30

[[channels]]
id = "cpu-cooler-rear"
chip_name = "nct6798"
index = 3
minimum_duty_percent = 30

[[channels]]
id = "intake-cpu"
chip_name = "nct6798"
index = 4
minimum_duty_percent = 30

[[channels]]
id = "intake-gpu-lsi"
chip_name = "nct6798"
index = 5
minimum_duty_percent = 30

# On the HBA's own shroud, not a case fan.
[[channels]]
id = "lsi-cooling"
chip_name = "nct6798"
index = 7
minimum_duty_percent = 30

# points are [temperature_celsius, duty_percent], ascending. The hottest of sensor_ids
# drives the fan; "drive:*" means every drive. fail_safe_duty_percent applies when every
# sensor is unreadable, and is the minimum when only some explicitly named one is.

[[curves]]
fan_channel_id = "cpu-cooler-front"
sensor_ids = ["cpu"]
points = [[30, 30], [45, 45], [60, 70], [75, 100]]
fail_safe_duty_percent = 100

[[curves]]
fan_channel_id = "cpu-cooler-rear"
sensor_ids = ["cpu"]
points = [[30, 30], [45, 45], [60, 70], [75, 100]]
fail_safe_duty_percent = 100

[[curves]]
fan_channel_id = "intake-cpu"
sensor_ids = ["cpu"]
points = [[30, 30], [45, 40], [60, 60], [75, 90]]
fail_safe_duty_percent = 100

[[curves]]
fan_channel_id = "intake-gpu-lsi"
zones = ["component-bay"]
sensor_ids = ["gpu"]
points = [[40, 30], [55, 45], [70, 70], [85, 100]]
fail_safe_duty_percent = 80

[[curves]]
fan_channel_id = "lsi-cooling"
sensor_ids = ["hba"]
points = [[45, 35], [55, 50], [65, 75], [75, 100]]
fail_safe_duty_percent = 80

# One fan for both cages: the hottest HDD in either sets the speed.
[[curves]]
fan_channel_id = "drive-cage"
zones = ["eight-bay", "four-bay"]
points = [[28, 30], [33, 45], [38, 65], [43, 90], [48, 100]]
fail_safe_duty_percent = 80
